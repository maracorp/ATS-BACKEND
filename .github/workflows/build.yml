
name: Build and Push MARA Backend

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::017731864102:role/GitHubActions-MARA-ECR
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t mara-backend .

      - name: Tag Docker image
        run: |
          docker tag mara-backend:latest \
            017731864102.dkr.ecr.us-east-2.amazonaws.com/mara/ats-backend:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            017731864102.dkr.ecr.us-east-2.amazonaws.com/mara/ats-backend:latest
